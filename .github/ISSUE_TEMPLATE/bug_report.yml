name: Bug report
description: Report a defect in Glacier Notes Cloud
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the observed behavior.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal steps another person can follow.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / build identifier
      description: From the admin status page, or the image tag you deployed.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - backend
        - frontend
        - database
        - security
        - operations/deployment
        - documentation
        - other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: >-
        Never paste note content, checklist text, filenames, passwords, or tokens — this project
        never logs them, and issue reports shouldn't either.
