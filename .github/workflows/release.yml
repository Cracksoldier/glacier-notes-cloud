name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Derive and validate the release version from the tag
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$tag' is not a valid vX.Y.Z release tag." >&2
            exit 1
          fi
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
      - name: Verify the tag matches the committed project version
        run: |
          version="${{ steps.version.outputs.version }}"
          # Both pom.xml files declare their own <version> before any nested
          # dependency/module <version> elements, so the first match in the file is
          # always the project version.
          root_version="$(sed -n '0,/<version>/{s#.*<version>\(.*\)</version>.*#\1#p}' pom.xml)"
          backend_version="$(sed -n '0,/<version>/{s#.*<version>\(.*\)</version>.*#\1#p}' backend/pom.xml)"
          frontend_version="$(jq -r '.version' frontend/package.json)"
          for v in "$root_version" "$backend_version" "$frontend_version"; do
            if [ "$v" != "$version" ]; then
              echo "::error::Tag version $version does not match the committed project version (pom.xml=$root_version, backend/pom.xml=$backend_version, frontend/package.json=$frontend_version). This release ships the already-committed version; bump those files first if you intend to release a different version." >&2
              exit 1
            fi
          done
      - name: Require a prior successful CI run for this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          count="$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=${{ github.sha }}&status=success" --jq '.workflow_runs | length')"
          if [ "$count" -lt 1 ]; then
            echo "::error::No successful ci.yml run found for commit ${{ github.sha }}. Merge to main and wait for CI to go green before tagging a release." >&2
            exit 1
          fi

  build-publish:
    runs-on: ubuntu-latest
    needs: gate
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      IMAGE: ghcr.io/cracksoldier/glacier-notes-cloud
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to republish an existing release tag
        run: |
          if docker manifest inspect "${IMAGE}:${TAG}" >/dev/null 2>&1; then
            echo "::error::${IMAGE}:${TAG} already exists. Release tags are immutable; publish a new version instead." >&2
            exit 1
          fi
      - uses: docker/setup-buildx-action@v3
      - name: Compute the build date
        id: date
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Build and push the release image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/docker/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.TAG }}
            ${{ env.IMAGE }}:latest
          build-args: |
            GIT_SHA=${{ github.sha }}
            APP_VERSION=${{ needs.gate.outputs.version }}
            BUILD_DATE=${{ steps.date.outputs.value }}
      - name: Scan the published image for critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          scanners: vuln,secret
          severity: CRITICAL
          exit-code: '1'
      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0
      - name: Generate a CycloneDX SBOM of the published image
        run: |
          syft "${IMAGE}@${{ steps.build.outputs.digest }}" \
            -o "cyclonedx-json=glacier-notes-cloud-${TAG}.cdx.json"
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Sign the release image (keyless)
        run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"
      - name: Attach the SBOM to the image as a signed attestation
        run: |
          cosign attest --yes --type cyclonedx \
            --predicate "glacier-notes-cloud-${TAG}.cdx.json" \
            "${IMAGE}@${{ steps.build.outputs.digest }}"
      - name: Sign the standalone SBOM file
        run: |
          cosign sign-blob --yes \
            --bundle "glacier-notes-cloud-${TAG}.cdx.sbom.cosign.bundle" \
            "glacier-notes-cloud-${TAG}.cdx.json"
      - name: Render the versioned release Compose file
        run: sed "s/__RELEASE_TAG__/${TAG}/g" deployment/docker/compose.release-template.yaml > "compose-${TAG}.yaml"
      - name: Record the image digest
        run: echo "${{ steps.build.outputs.digest }}" > IMAGE_DIGEST.txt
      - name: Generate checksums for downloadable artifacts
        run: sha256sum "glacier-notes-cloud-${TAG}.cdx.json" "compose-${TAG}.yaml" IMAGE_DIGEST.txt > SHA256SUMS
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            glacier-notes-cloud-${{ env.TAG }}.cdx.json
            glacier-notes-cloud-${{ env.TAG }}.cdx.sbom.cosign.bundle
            compose-${{ env.TAG }}.yaml
            IMAGE_DIGEST.txt
            SHA256SUMS
          retention-days: 90

  verify-published-artifacts:
    runs-on: ubuntu-latest
    needs: [gate, build-publish]
    permissions:
      contents: read
      packages: read
      actions: read
    env:
      TAG: ${{ github.ref_name }}
      COMPOSE_FILE: compose-${{ github.ref_name }}.yaml
      GLACIER_BACKUP_ENABLED: 'true'
    steps:
      - name: Download rendered release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create ephemeral Compose secrets
        run: |
          mkdir -p deployment/secrets
          printf '%s\n' 'release-verify-database-password-32chars' > deployment/secrets/database-password.txt
          printf '%s\n' 'release-verify-bootstrap-token-with-32-chars' > deployment/secrets/bootstrap-token.txt
          printf '%s\n' 'release-verify-session-secret-with-32-chars' > deployment/secrets/session-secret.txt
          # Mirror what the operator documentation prescribes, so this smoke test exercises the path
          # an operator actually follows rather than the runner's permissive default.
          chmod 600 deployment/secrets/*.txt
          sudo chown 10001:10001 deployment/secrets/*.txt
      - name: Pull and start the published release
        run: docker compose up --pull always --wait --wait-timeout 180
      - name: Verify application and management endpoints
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8080/ >/dev/null
          curl --fail --silent --show-error \
            http://127.0.0.1:8080/api/v1/setup/status \
            | jq --exit-status '.setupRequired == true' >/dev/null
          curl --fail --silent --show-error \
            http://127.0.0.1:9000/q/health/ready \
            | jq --exit-status '.status == "UP"' >/dev/null
      - name: Bootstrap the administrator and verify the reported release version
        run: |
          curl --fail --silent \
            --header 'Content-Type: application/json' \
            --header 'X-Bootstrap-Token: release-verify-bootstrap-token-with-32-chars' \
            --data '{"username":"admin","email":"admin@example.com","password":"release-verify-passphrase-2026"}' \
            http://127.0.0.1:8080/api/v1/setup/administrator | grep '"initialized":true'
          curl --fail --silent \
            --cookie-jar /tmp/glacier-cookies.txt \
            --header 'Content-Type: application/json' \
            --data '{"identifier":"admin","password":"release-verify-passphrase-2026","rememberMe":false}' \
            http://127.0.0.1:8080/api/v1/auth/login >/dev/null
          admin_status="$(curl --fail --silent --cookie /tmp/glacier-cookies.txt http://127.0.0.1:8080/api/v1/admin/status)"
          printf '%s' "$admin_status" | jq --exit-status --arg v "${{ needs.gate.outputs.version }}" '.applicationVersion == $v'
          printf '%s' "$admin_status" | jq --exit-status --arg t "$TAG" '.buildIdentifier == $t'
      - name: Verify backup creation and clean database restore
        run: |
          csrf_token="$(awk '$6 == "GLACIER_CSRF" {print $7}' /tmp/glacier-cookies.txt)"
          test -n "$csrf_token"
          backup_id="$(curl --fail --silent --show-error \
            --cookie /tmp/glacier-cookies.txt \
            --header "X-CSRF-Token: $csrf_token" \
            --request POST \
            http://127.0.0.1:8080/api/v1/admin/backups | jq --raw-output '.id')"
          test -n "$backup_id"
          for attempt in $(seq 1 60); do
            backup_json="$(curl --fail --silent --show-error \
              --cookie /tmp/glacier-cookies.txt \
              "http://127.0.0.1:8080/api/v1/admin/backups/$backup_id")"
            state="$(printf '%s' "$backup_json" | jq --raw-output '.state')"
            if [ "$state" = "SUCCEEDED" ]; then break; fi
            test "$state" != "FAILED"
            sleep 1
          done
          test "$state" = "SUCCEEDED"
          output="$(printf '%s' "$backup_json" | jq --raw-output '.outputIdentifier')"
          expected_archive_checksum="$(printf '%s' "$backup_json" | jq --raw-output '.checksum')"
          docker compose cp "app:/var/lib/glacier-notes/backups/$output" /tmp/glacier-backup.zip
          test "$(sha256sum /tmp/glacier-backup.zip | cut -d' ' -f1)" = "$expected_archive_checksum"
          mkdir /tmp/glacier-backup-contents
          unzip -q /tmp/glacier-backup.zip -d /tmp/glacier-backup-contents
          jq -r '.checksums | to_entries[] | [.value, .key] | @tsv' \
            /tmp/glacier-backup-contents/manifest.json |
            while IFS="$(printf '\t')" read -r expected path; do
              printf '%s  %s\n' "$expected" "/tmp/glacier-backup-contents/$path" |
                sha256sum --check -
            done
          docker run --detach --name glacier-release-restore \
            --env POSTGRES_PASSWORD=clean-restore-password \
            --env POSTGRES_DB=glacier_restore postgres:18.3-alpine
          restore_db_ready=false
          for attempt in $(seq 1 60); do
            if docker exec --env PGPASSWORD=clean-restore-password glacier-release-restore \
              psql -U postgres -d glacier_restore --quiet --command 'select 1' >/dev/null 2>&1; then
              restore_db_ready=true
              break
            fi
            sleep 1
          done
          test "$restore_db_ready" = "true"
          docker cp /tmp/glacier-backup-contents/database.dump \
            glacier-release-restore:/tmp/database.dump
          docker exec --env PGPASSWORD=clean-restore-password glacier-release-restore \
            pg_restore --clean --if-exists --no-owner --no-privileges \
              -U postgres -d glacier_restore /tmp/database.dump
          docker exec --env PGPASSWORD=clean-restore-password glacier-release-restore \
            psql -U postgres -d glacier_restore --tuples-only \
              --command 'select count(*) from flyway_schema_history;' |
            grep --extended-regexp '[1-9]'
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop deployment
        if: always()
        run: |
          docker rm --force glacier-release-restore 2>/dev/null || true
          docker compose down --volumes

  github-release:
    runs-on: ubuntu-latest
    needs: [gate, build-publish, verify-published-artifacts]
    permissions:
      contents: write
      actions: read
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG" \
            --verify-tag \
            --title "Glacier Notes Cloud $TAG" \
            --notes-file docs/RELEASE_NOTES.md \
            "compose-${TAG}.yaml" \
            "glacier-notes-cloud-${TAG}.cdx.json" \
            "glacier-notes-cloud-${TAG}.cdx.sbom.cosign.bundle" \
            IMAGE_DIGEST.txt \
            SHA256SUMS
