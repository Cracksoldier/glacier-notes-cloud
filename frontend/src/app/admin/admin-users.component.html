<h1>{{ i18n.t('adminUsersTitle') }}</h1>
<form (ngSubmit)="load()">
  <label>{{ i18n.t('adminUsersSearch') }} <input name="query" [(ngModel)]="query"></label>
  <button type="submit">{{ i18n.t('adminUsersSearch') }}</button>
</form>
@if (error()) {
<p role="alert">{{ error() }}</p>
}
<div class="list">
  @for (user of users(); track user.id) {
  <a class="card" href="/admin/users" [routerLink]="[user.id]">
    <strong>{{ user.username }}</strong><span>{{ user.email }}</span>
    <span>{{ user.role }} · {{ user.status }}</span>
    <span>{{ user.noteCount }} notes · {{ user.storageBytes }} bytes</span>
  </a>
  } @empty {
  <p>{{ i18n.t('adminUsersNoUsers') }}</p>
  }
</div>
