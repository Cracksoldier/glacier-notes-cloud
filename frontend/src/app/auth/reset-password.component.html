<main class="public-page">
  <section class="card">
    <h1>{{ i18n.t('authChooseNewPassword') }}</h1>
    @if (!done()) {
    <form (ngSubmit)="submit()">
      <label
        >{{ i18n.t('authResetToken') }}
        <input
          name="token"
          type="password"
          autocomplete="off"
          spellcheck="false"
          [(ngModel)]="token"
          required
        ></label
      >
      <label
        >{{ i18n.t('authNewPasswordLabel') }}
        <input
          name="password"
          type="password"
          [(ngModel)]="password"
          minlength="12"
          required
        ></label
      >
      <button type="submit" [disabled]="busy()">
        {{ busy() ? i18n.t('authChangingPassword') : i18n.t('authChangePassword') }}
      </button>
    </form>
    } @else {
    <p role="status">{{ i18n.t('authPasswordChanged') }}</p>
    <a href="/login" routerLink="/login">{{ i18n.t('authSignIn') }}</a>
    } @if (error()) {
    <p class="error" role="alert">{{ error() }}</p>
    }
  </section>
</main>
