<main class="public-page">
  <section class="card">
    <h1>{{ i18n.t('authResetTitle') }}</h1>
    <p>{{ i18n.t('authResetIntro') }}</p>
    @if (!sent()) {
    <form (ngSubmit)="submit()">
      <label
        >{{ i18n.t('authEmail') }}
        <input name="email" type="email" [(ngModel)]="email" required></label
      >
      <button type="submit">{{ i18n.t('authRequestReset') }}</button>
    </form>
    } @else {
    <p role="status">{{ i18n.t('authResetInstructionsSent') }}</p>
    }
    <a href="/login" routerLink="/login">{{ i18n.t('authBackToSignIn') }}</a>
  </section>
</main>
